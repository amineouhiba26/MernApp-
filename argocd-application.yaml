apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mern-app
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/amineouhiba26/MernApp-.git
    targetRevision: HelmCharts-ArgoCd
    path: mern-charts/mern-app
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
